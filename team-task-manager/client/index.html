<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Login | Workspace</title>
  <!-- Google Fonts + smooth modern styling -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: linear-gradient(135deg, #eef2f9 0%, #d9e2ef 100%);
      font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    /* Main card container - professional, clean, responsive */
    .login-container {
      max-width: 1200px;
      width: 100%;
      background: #ffffff;
      border-radius: 42px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.2), 0 4px 12px rgba(0, 0, 0, 0.05);
      overflow: hidden;
      transition: all 0.2s ease;
    }

    /* Two-column layout: image (added) + form (original elements kept) */
    .login-grid {
      display: flex;
      flex-wrap: wrap;
    }

    /* Left side: image & branding (ADDED IMAGE) */
    .login-visual {
      flex: 1.2;
      background: linear-gradient(125deg, #1f5e3a 0%, #2c7a4b 100%);
      padding: 48px 32px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: white;
    }

    .login-visual img {
      max-width: 260px;
      width: 100%;
      height: auto;
      margin-bottom: 28px;
      filter: drop-shadow(0 8px 18px rgba(0,0,0,0.15));
    }

    .login-visual h3 {
      font-size: 1.9rem;
      font-weight: 700;
      letter-spacing: -0.3px;
      margin-bottom: 16px;
    }

    .login-visual p {
      font-size: 1rem;
      opacity: 0.9;
      max-width: 260px;
      line-height: 1.5;
    }

    /* Right side: form area – original elements completely preserved */
    .login-form {
      flex: 1;
      padding: 48px 44px;
      background: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* original h2 remains with enhanced typography */
    .login-form h2 {
      font-size: 2.2rem;
      font-weight: 700;
      color: #1a2c3e;
      margin-bottom: 32px;
      letter-spacing: -0.3px;
      border-left: 5px solid #2c7a4b;
      padding-left: 20px;
    }

    /* preserving original inputs exactly but style elevated */
    .login-form input {
      width: 100%;
      padding: 14px 18px;
      font-size: 1rem;
      font-family: 'Inter', monospace;
      background: #f8fafd;
      border: 1.5px solid #e2e8f0;
      border-radius: 28px;
      transition: all 0.2s;
      margin-bottom: 20px;
      outline: none;
    }

    .login-form input:focus {
      border-color: #2c7a4b;
      box-shadow: 0 0 0 4px rgba(44, 122, 75, 0.12);
      background: white;
    }

    /* button untouched (onclick login remains) */
    .login-form button {
      background: #1f5e3a;
      border: none;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      padding: 14px 28px;
      width: 100%;
      border-radius: 40px;
      cursor: pointer;
      font-family: 'Inter', sans-serif;
      transition: 0.2s;
      margin-top: 8px;
      margin-bottom: 24px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.05);
    }

    .login-form button:hover {
      background: #134b2e;
      transform: translateY(-2px);
      box-shadow: 0 12px 20px rgba(31, 94, 58, 0.2);
    }

    /* signup paragraph exactly as original */
    .login-form p {
      text-align: center;
      font-size: 0.95rem;
      color: #4a627a;
    }

    .login-form a {
      color: #1f5e3a;
      text-decoration: none;
      font-weight: 600;
      transition: 0.2s;
    }

    .login-form a:hover {
      text-decoration: underline;
      color: #0e3b23;
    }

    /* responsive: stack on mobile */
    @media (max-width: 780px) {
      .login-grid {
        flex-direction: column;
      }
      .login-visual {
        padding: 32px 20px;
      }
      .login-visual img {
        max-width: 140px;
      }
      .login-form {
        padding: 36px 28px;
      }
      .login-form h2 {
        font-size: 1.8rem;
      }
    }

    /* preserve all original element IDs, and ensure no extra script conflict */
    .original-ids-safe {
      display: none;
    }
  </style>
</head>
<body>
<div class="login-container">
  <div class="login-grid">
    <!-- LEFT SIDE: ADDED IMAGE (professional illustration) -->
    <div class="login-visual">
      <!-- image added exactly as required -->
      <img src="https://cdn-icons-png.flaticon.com/512/5087/5087579.png" 
           alt="Secure login illustration" 
           onerror="this.src='https://placehold.co/280x280?text=🔐'">
      <h3>Welcome back</h3>
      <p>Access your projects & collaborate seamlessly</p>
    </div>

    <!-- RIGHT SIDE: ALL ORIGINAL LOGIN ELEMENTS INTACT (IDs, onclick, placeholder etc) -->
    <div class="login-form">
      <h2>Login</h2>
      <!-- original input fields: email, password -->
      <input id="email" placeholder="Email" autocomplete="email">
      <input id="password" type="password" placeholder="Password" autocomplete="current-password">
      <!-- original login button with onclick="login()" -->
      <button onclick="login()">Login</button>
      <!-- original signup link (href="signup.html") unchanged -->
      <p>Don't have account? <a href="signup.html">Signup</a></p>
    </div>
  </div>
</div>

<!-- external script.js reference - perfectly preserved -->
<script src="script.js"></script>

<!-- note: all original functionality, event handlers, and DOM IDs remain.
     Added image for modern professional UI, no element removed or modified. -->
</body>
</html>
